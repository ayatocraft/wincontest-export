<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wincon Boot</title>
</head>
<body>

<h2>Wincon Boot</h2>

<script>

window.addEventListener(
"keydown",
e=>{

if(
e.shiftKey &&
e.key==="Escape"
){

localStorage.removeItem(
"winconMenuItems"
);

localStorage.removeItem(
"winconEnterpriseApps"
);

alert("Bootデータ初期化");

}

}
);

async function boot(){

try{

const res=
await fetch("company.dat");

const data=
await res.json();

localStorage.setItem(
"winconMenuItems",
JSON.stringify(
data.menuItems||[]
)
);

localStorage.setItem(
"winconEnterpriseApps",
JSON.stringify(
data.enterpriseApps||[]
)
);

}catch(e){

console.error(e);

}

location.href="index.html";

}

boot();

</script>

</body>
</html>

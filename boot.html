<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wincon Boot</title>
<style>
body{
margin:0;
background:#0d0d0d;
color:#fff;
font-family:sans-serif;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
flex-direction:column;
}
.bar{
width:260px;
height:6px;
background:#333;
border-radius:3px;
overflow:hidden;
margin-top:20px;
}
.progress{
width:0%;
height:100%;
background:#4caf50;
animation:load 2s forwards;
}
@keyframes load{
to{width:100%;}
}
</style>
</head>
<body>

<h2>Wincon Starting</h2>
<p>Loading system...</p>

<div class="bar"><div class="progress"></div></div>

<script>
setTimeout(() => {
  location.href = "wincon.html";
}, 2000);
</script>

</body>
</html>
